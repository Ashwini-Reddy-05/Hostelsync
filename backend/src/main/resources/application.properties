spring.application.name=hostelsync
server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/hostelsync?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- Hibernate / JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-123456}
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ---- Cloudinary ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ---- Spring Mail (Gmail SMTP example; use an App Password) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USER:your_email@gmail.com}

# ---- Uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
